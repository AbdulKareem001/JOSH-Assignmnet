<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JTGeats | Home</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <div class="nav-container">
      <div class="logo">JTGeats</div>
      <nav class="nav-links">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Menu</a>
        <a href="#">Blog</a>
        <a href="#">Contact</a>
      </nav>
      <div class="nav-icons">
        <div class="search-icon">
          <img src="https://img.icons8.com/ios-filled/24/ffffff/search--v1.png" alt="Search" width="24" height="24"/>
        </div>
        <div class="cart-icon">
          <img src="https://img.icons8.com/ios-filled/24/ffffff/cart-bag.png" alt="Cart" width="24" height="24"/>
        </div>
      </div>
    </div>
  </header>

  <main class="hero">
    <div class="hero-left">
      <h1>Authentic Home<br><span>food in India</span></h1>
      <p>JTGeats is a courier service in which authentic home cook food is delivered to a customer.</p>
      <div class="search-box">
        <input type="text" placeholder="Search food you love" />
        <button>Search</button>
      </div>
    </div>
    <div class="hero-right">
      <img src="assets/cuate.png" alt="kitchen-image" itemtype="http://schema.org/ImageObject" itemprop="image"/>
    </div>
  </main>

  <section class="home-kitchen">
    <h2>Home Kitchen</h2>
    <div class="pizza-grid">
      <!-- Pizza cards will be dynamically loaded from data.json -->
    </div>
  </section>

  <section class="popular-items">
    <h2>Popular Items</h2>
    <div class="carousel-container">
      <div class="carousel-header">
        <div class="carousel-indicators">
          <span class="indicator active" data-index="0"></span>
          <span class="indicator" data-index="1"></span>
          <span class="indicator" data-index="2"></span>
          <span class="indicator" data-index="3"></span>
          <span class="indicator" data-index="4"></span>
        </div>
        <div class="carousel-controls">
          <button class="carousel-nav prev" onclick="moveCarousel(-1)">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="carousel-nav next" onclick="moveCarousel(1)">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="carousel-wrapper" id="carousel">
        <!-- Popular items will be dynamically loaded from popular-items.json -->
      </div>
    </div>
    <button class="request-dish-btn" onclick="openModal()">Request a Dish</button>
  </section>


  <!-- <section class="hero">
        <div class="hero-container">
            <h1>We are providing best<br>home cooked food delivery service.</h1>
            <p>Away from home and craving the tasty homemade recipes?<br>Choose from a selection of our delicious home cooked dishes</p>
            
            <div class="video-container" onclick="toggleVideo()">
                <video id="foodVideo" muted>
                    <source src="https://sample-videos.com/zip/10/mp4/SampleVideo_1280x720_1mb.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                <div class="play-overlay" id="playOverlay">
                    <div class="play-icon"></div>
                </div>
            </div>
        </div>
    </section> -->

  

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-brand">JTEeats</div>
            <nav>
                <ul class="footer-nav">
                    <li><a href="#home">Home</a></li>
                    <li><a href="#about">About</a></li>
                    <li><a href="#menu">Menu</a></li>
                    <li><a href="#blog">Blog</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </nav>
            <div class="social-icons">
                <a href="#" class="social-icon">f</a>
                <a href="#" class="social-icon">@</a>
            </div>
        </div>
    </footer>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <h3>Request a Custom Dish</h3>
      <form id="requestForm">
        <div class="form-group">
          <label for="dishName">Dish Name</label>
          <input type="text" id="dishName" name="dishName" placeholder="Enter the dish name you'd like to request">
        </div>
        <div class="form-group">
          <label for="customerName">Your Name</label>
          <input type="text" id="customerName" name="customerName" placeholder="Enter your full name">
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="Enter your email address">
        </div>
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">
        </div>
        <div class="form-group">
          <label for="description">Special Instructions</label>
          <textarea id="description" name="description" placeholder="Any special requirements or cooking preferences..."></textarea>
        </div>
        <div class="modal-buttons">
          <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
          <button type="button" class="btn-submit" onclick="submitRequest()">Submit Request</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
